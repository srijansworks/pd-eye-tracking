[project]
name = "pdml"
version = "0.1.0"
description = "Wrist features, PADS loader and multi-sensor models (research prototype, not a medical device)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.11", "scikit-learn>=1.4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pdml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
